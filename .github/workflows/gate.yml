# The gate (SNAP-GRID.md section 7.3, kept by VECTOR-SCENE.md section 7): `npm run gate` on every push
# and pull request, on Node 22 and Node 24, then the consumer test on Node 22.
#
# The workflow runs `npm run gate` rather than listing its steps, so it cannot drift from package.json.
# The gate holds a real-Chrome test (CONTRACT.md I10, test/browser/), which launches the runner's own
# google-chrome -- or $CHROME -- headless with a profile and a debugging port of its own, and drives it
# with trusted input over the DevTools protocol through Node.js's global WebSocket, no dependency added.
# mission-kit's style checks are fetched, never copied (SNAP-GRID.md's decision D8): mission-kit is checked
# out at HEAD and MISSION_KIT points at it, so an upstream change can turn this repository red with no
# commit here.
name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # a backstop: a hang fails the job rather than holding a runner for hours
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: fetch the style rules (mission-kit at HEAD)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: apnex/mission-kit
          path: .mission-kit
      - run: npm run gate
        env:
          MISSION_KIT: ${{ github.workspace }}/.mission-kit

  # The package as a consumer receives it: packed, installed with --omit=dev into an empty project,
  # imported by name in Node 22, and loaded in headless Chrome through an import map.
  consumer:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run consumer
