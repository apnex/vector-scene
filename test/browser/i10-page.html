<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vector-scene I10</title>
<script type="importmap">{ "imports": { "@apnex/vector-scene": "/dist/index.js" } }</script>
<style>
html, body { margin: 0; }
svg { position: absolute; left: 40px; top: 20px; display: block; touch-action: none; }
</style>
</head>
<body>
<!-- the root lies 40 px right and 20 px down the page, 437 by 300 screen pixels showing a viewBox of 200 by 100
drawing units from (-100, -50): scaled by 2.185 and letterboxed 40.75 px down, so a screen point (x, y) lies at
((x - 40) / 2.185 - 100, (y - 60.75) / 2.185 - 50) in the drawing; the ground is the application's, before the
layers the scene appends -->
<svg id="root" width="437" height="300" viewBox="-100 -50 200 100"><rect id="ground" x="-100" y="-50" width="200" height="100" fill="#eee"/></svg>
<script type="module" src="/test/browser/i10-page.js"></script>
</body>
